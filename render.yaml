services:
  - type: web
    name: networkautomation-cybersecurity-ui
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt && python VERIFY_RELEASE.py && python QA_PRODUCTION_GATE.py
    startCommand: python render_start.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NA_ALLOWED_HOSTS
        value: "*"
      - key: NA_COOKIE_SECURE
        value: "1"
      - key: NA_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: NA_ENABLE_AUTOIP
        value: "0"
      - key: NA_WEB_ONLY_BROWSER
        value: "1"
      - key: NA_PUBLIC_REGISTRATION
        value: "1"
      - key: NA_REGISTRATION_AUTO_ENABLE
        value: "1"
